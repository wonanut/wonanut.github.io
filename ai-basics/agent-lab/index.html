── */\nexport const LAB_MAX_SESSIONS = 20;\nexport const LAB_MAX_MESSAGES = 120; // 每会话消息上限\nexport const LAB_MAX_TRANSCRIPT = 200; // 每会话 transcript 行数上限\nexport const LAB_MEMORY_LIMIT = 60; // 长期记忆条数上限\nexport const LAB_MAX_SUMMARY_LINES = 30; // 摘要行数上限\nexport const LAB_MAX_INPUT_CHARS = 600;\nexport const LAB_COMPRESS_RATIO = 0.9; // 超过 limit * 0.9 时触发自动压缩\nexport const LAB_SUMMARY_TOKEN_RATIO = 0.16; // 摘要最多占预算 16%\nexport const LAB_MSG_OVERHEAD = 4; // 每条消息额外估算 token（角色/分隔）\n\n/* ── pacing：流式节奏（毫秒） ── */\nexport const LAB_PACE_DELAYS: Record\u003cPace, number\u003e = { fast: 3, normal: 14, slow: 30 };\n\n/* ── 首行 banner 与 system prompt ── */\nexport const LAB_BANNER = 'Agent Lab v0.1 · 模拟 / 真实 双模式 · 输入 /help 查看命令';\n\nexport const LAB_SYSTEM_PROMPT =\n  '你是「Agent 实验室」的教学用迷你 Agent，由规则驱动的模拟模型扮演：不联网、可复现。' +\n  '你演示最小 agent 循环——理解输入、组装上下文、决定回答或调用工具、读取真实工具结果、' +\n  '再继续下一步，直到给出最终回答。请用简体中文简洁回答。';\n\n/* ─────────────────────────────────────────────────────────────\n * token 估算\n * CJK 约 1 token/字，其他约 4 字符/token，向上取整；用码点遍历避免拆开 emoji 代理对。\n * ───────────────────────────────────────────────────────────── */\nexport function estimateTokens(text: unknown): number {\n  if (text === null || text === undefined) return 0;\n  const s = String(text);\n  if (!s) return 0;\n  let cjk = 0;\n  let other = 0;\n  for (const ch of s) {\n    if (isCjkChar(ch)) cjk += 1;\n    else other += 1;\n  }\n  return Math.ceil(cjk + other / 4);\n}\n\nfunction isCjkChar(ch: string): boolean {\n  const code = ch.codePointAt(0) ?? 0;\n  if (code \u003e= 0x2e80 \u0026\u0026 code \u003c= 0x9fff) return true; // CJK 部首、汉字、假名、CJK 标点\n  if (code \u003e= 0xf900 \u0026\u0026 code \u003c= 0xfaff) return true; // CJK 兼容汉字\n  if (code \u003e= 0xff00 \u0026\u0026 code \u003c= 0xffef) return true; // 全角字符与标点\n  return false;\n}\n\n/* 字符数（按码点计） */\nexport function charCount(text: unknown): number {\n  if (text === null || text === undefined) return 0;\n  return Array.from(String(text)).length;\n}\n\n/* ── 时间格式化 ── */\nfunction pad2(n: number): string {\n  return n \u003c 10 ? '0' + n : String(n);\n}\n\nexport function fmtClock(ts?: number): string {\n  const d = new Date(typeof ts === 'number' ? ts : Date.now());\n  if (isNaN(d.getTime())) return '--:--:--';\n  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());\n}\n\nexport function fmtTime(ts?: number): string {\n  const d = new Date(typeof ts === 'number' ? ts : Date.now());\n  if (isNaN(d.getTime())) return '----/--/-- --:--';\n  return (\n    d.getFullYear() +\n    '-' +\n    pad2(d.getMonth() + 1) +\n    '-' +\n    pad2(d.getDate()) +\n    ' ' +\n    pad2(d.getHours()) +\n    ':' +\n    pad2(d.getMinutes())\n  );\n}\n\n/* ── 文本工具 ── */\n\n/** 最多 n 个字符（含省略号），按码点裁剪。 */\nexport function truncate(text: unknown, n: number): string {\n  const s = text === null || text === undefined ? '' : String(text);\n  if (typeof n !== 'number' || n \u003c= 0) return '';\n  const chars = Array.from(s);\n  if (chars.length \u003c= n) return chars.join('');\n  if (n \u003c= 1) return '…';\n  return chars.slice(0, n - 1).join('') + '…';\n}\n\n/** 折叠空白并裁剪到最多 max 个字符。 */\nexport function cleanText(text: unknown, max?: number): string {\n  const s = (text === null || text === undefined ? '' : String(text)).replace(/\\s+/g, ' ').trim();\n  if (typeof max === 'number' \u0026\u0026 max \u003e 0) return truncate(s, max);\n  return s;\n}\n\n/** 按 token 预算裁剪文本：保证 estimateTokens(结果) \u003c= maxTokens。 */\nexport function truncateToTokens(text: unknown, maxTokens: number): string {\n  const s = text === null || text === undefined ? '' : String(text);\n  if (typeof maxTokens !== 'number' || maxTokens \u003c= 0) return '';\n  if (estimateTokens(s) \u003c= maxTokens) return s;\n  const chars = Array.from(s);\n  let lo = 0;\n  let hi = chars.length;\n  while (lo \u003c hi) {\n    const mid = Math.ceil((lo + hi) / 2);\n    const candidate = chars.slice(0, mid).join('') + '…';\n    if (estimateTokens(candidate) \u003c= maxTokens) lo = mid;\n    else hi = mid - 1;\n  }\n  return lo \u003e 0 ? chars.slice(0, lo).join('') + '…' : '';\n}\n\n/* ── id 生成 ── */\nlet uidSeq = 0;\nexport function uid(prefix?: string): string {\n  uidSeq += 1;\n  const tail = Math.floor(Math.random() * 0x1000000)\n    .toString(36)\n    .slice(-4);\n  return String(prefix || 'id') + '_' + uidSeq.toString(36) + tail;\n}\n\n/* ── 其他纯工具 ── */\n\n/** 可 JSON 序列化的深拷贝（只用于纯数据）。 */\nexport function clone\u003cT\u003e(value: T): T {\n  if (value === null || typeof value !== 'object') return value;\n  if (Array.isArray(value)) return value.map((v) =\u003e clone(v)) as unknown as T;\n  const out: Record\u003cstring, unknown\u003e = {};\n  for (const key of Object.keys(value as Record\u003cstring, unknown\u003e)) {\n    out[key] = clone((value as Record\u003cstring, unknown\u003e)[key]);\n  }\n  return out as unknown as T;\n}\n\n/** JSON.stringify 的安全版本。 */\nexport function json(value: unknown): string {\n  try {\n    const text = JSON.stringify(value);\n    return typeof text === 'string' ? text : '{}';\n  } catch {\n    return '{}';\n  }\n}\n\n/** 把任意异常转成一行中文可读信息。 */\nexport function errorMessage(err: unknown): string {\n  if (err \u0026\u0026 typeof err === 'object' \u0026\u0026 typeof (err as Error).message === 'string' \u0026\u0026 (err as Error).message) {\n    return (err as Error).message;\n  }\n  if (typeof err === 'string' \u0026\u0026 err) return err;\n  return '未知错误';\n}\n\nexport function normalizePace(pace: unknown): Pace {\n  return pace === 'fast' || pace === 'slow' || pace === 'normal' ? pace : 'normal';\n}\n"])</script><script>self.__next_f.push([1,"7:T24ce,"])</script><script>self.__next_f.push([1,"// 工具注册表与 4 个工具实现。协议：{ name, description, parameters, run(args, ctx) -\u003e { ok, result, display } }。\n// run 可以是 async；ctx 由 engine 注入；工具失败不抛异常，返回 { ok:false, result:{error}, display:'错误：…' }。\n\nimport { cleanText, errorMessage, json } from './core';\nimport type { MemoryItem } from './types';\n\nexport interface ToolResult {\n  ok: boolean;\n  result: unknown;\n  display: string;\n}\n\nexport interface ToolContext {\n  now: () =\u003e number;\n  sessionId: string;\n  writeMemory: (input: { key: string; value: string; source: string; sessionId: string }) =\u003e MemoryItem | null;\n  searchMemory: (query: string) =\u003e MemoryItem[];\n}\n\nexport interface ToolDefinition {\n  name: string;\n  description: string;\n  parameters: {\n    type: 'object';\n    properties: Record\u003cstring, { type: string; description?: string; items?: { type: string } }\u003e;\n    required: string[];\n  };\n  run: (args: Record\u003cstring, unknown\u003e, ctx: ToolContext) =\u003e ToolResult | Promise\u003cToolResult\u003e;\n}\n\n/* ── 安全计算器：词法分析 + 递归下降，不 eval ── */\ntype CalcToken =\n  | { type: 'num'; value: number }\n  | { type: '+' | '-' | '*' | '/' | '%' | '^' | '(' | ')' };\n\nfunction calcTokenize(expression: string): CalcToken[] | null {\n  const source = String(expression).replace(/\\s+/g, '');\n  if (!source) return null;\n  const tokens: CalcToken[] = [];\n  let i = 0;\n  while (i \u003c source.length) {\n    const ch = source.charAt(i);\n    if (ch \u003e= '0' \u0026\u0026 ch \u003c= '9') {\n      let j = i;\n      let dots = 0;\n      while (j \u003c source.length \u0026\u0026 (source.charAt(j) === '.' || (source.charAt(j) \u003e= '0' \u0026\u0026 source.charAt(j) \u003c= '9'))) {\n        if (source.charAt(j) === '.') dots += 1;\n        j += 1;\n      }\n      if (dots \u003e 1) return null;\n      const num = Number(source.slice(i, j));\n      if (!isFinite(num)) return null;\n      tokens.push({ type: 'num', value: num });\n      i = j;\n      continue;\n    }\n    if ('+-*/%^()'.indexOf(ch) \u003e= 0) {\n      tokens.push({ type: ch as '+' | '-' | '*' | '/' | '%' | '^' | '(' | ')' });\n      i += 1;\n      continue;\n    }\n    return null; // 出现不认识的字符\n  }\n  return tokens;\n}\n\nfunction calcParse(tokens: CalcToken[]): number {\n  let pos = 0;\n  const peek = (): CalcToken | undefined =\u003e tokens[pos];\n  function fail(message: string): never {\n    throw new Error(message);\n  }\n\n  function parseExpression(): number {\n    let left = parseTerm();\n    while (peek() \u0026\u0026 (peek()!.type === '+' || peek()!.type === '-')) {\n      const op = tokens[pos].type as string;\n      pos += 1;\n      const right = parseTerm();\n      left = op === '+' ? left + right : left - right;\n    }\n    return left;\n  }\n  function parseTerm(): number {\n    let left = parseUnary();\n    while (peek() \u0026\u0026 (peek()!.type === '*' || peek()!.type === '/' || peek()!.type === '%')) {\n      const op = tokens[pos].type as string;\n      pos += 1;\n      const right = parseUnary();\n      if (op === '*') left = left * right;\n      else if (op === '/') {\n        if (right === 0) fail('除数不能为 0');\n        left = left / right;\n      } else {\n        if (right === 0) fail('取余的除数不能为 0');\n        left = left % right;\n      }\n    }\n    return left;\n  }\n  function parseUnary(): number {\n    if (peek() \u0026\u0026 peek()!.type === '-') {\n      pos += 1;\n      return -parseUnary();\n    }\n    if (peek() \u0026\u0026 peek()!.type === '+') {\n      pos += 1;\n      return parseUnary();\n    }\n    return parsePower();\n  }\n  function parsePower(): number {\n    const base = parsePrimary();\n    if (peek() \u0026\u0026 peek()!.type === '^') {\n      pos += 1;\n      return Math.pow(base, parseUnary()); // 右结合，允许 2^-1\n    }\n    return base;\n  }\n  function parsePrimary(): number {\n    const token = peek();\n    if (!token) fail('表达式不完整');\n    if (token.type === 'num') {\n      pos += 1;\n      return token.value;\n    }\n    if (token.type === '(') {\n      pos += 1;\n      const value = parseExpression();\n      if (!peek() || peek()!.type !== ')') fail('括号不匹配');\n      pos += 1;\n      return value;\n    }\n    fail('这里需要一个数字或左括号');\n    return 0;\n  }\n\n  const result = parseExpression();\n  if (pos !== tokens.length) fail('表达式有多余内容');\n  return result;\n}\n\nfunction toolError(message: string): ToolResult {\n  const text = cleanText(message, 120) || '工具调用失败';\n  return { ok: false, result: { error: text }, display: '错误：' + text };\n}\n\nconst CALCULATOR: ToolDefinition = {\n  name: 'calculator',\n  description: '安全计算四则 / 幂 / 括号表达式，返回数值结果',\n  parameters: {\n    type: 'object',\n    properties: { expression: { type: 'string', description: '要计算的表达式，例如 (12+30)*3' } },\n    required: ['expression'],\n  },\n  run(args) {\n    try {\n      const expression = typeof args?.expression === 'string' ? args.expression : '';\n      if (!expression.trim()) return toolError('缺少表达式');\n      const tokens = calcTokenize(expression);\n      if (!tokens) return toolError('只能计算数字与 + - * / % ^ ( )');\n      const value = calcParse(tokens);\n      if (typeof value !== 'number' || !isFinite(value)) return toolError('计算结果不是有限数字');\n      let rounded = Math.round(value * 1e12) / 1e12;\n      if (Object.is(rounded, -0)) rounded = 0;\n      return { ok: true, result: { expression: expression.trim(), value: rounded }, display: String(rounded) };\n    } catch (err) {\n      return toolError(errorMessage(err));\n    }\n  },\n};\n\nconst CLOCK: ToolDefinition = {\n  name: 'clock',\n  description: '读取本机当前时间与日期，可指定 format=time/date/full',\n  parameters: {\n    type: 'object',\n    properties: { format: { type: 'string', description: 'time | date | full，默认 full' } },\n    required: [],\n  },\n  run(args, ctx) {\n    try {\n      const ts = typeof ctx?.now === 'function' ? ctx.now() : Date.now();\n      const d = new Date(ts);\n      if (isNaN(d.getTime())) return toolError('时钟不可用');\n      const pad = (n: number) =\u003e (n \u003c 10 ? '0' + n : String(n));\n      const time = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());\n      const date = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());\n      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\n      const weekday = weekdays[d.getDay()];\n      const format = typeof args?.format === 'string' ? args.format : 'full';\n      const display = format === 'time' ? time : format === 'date' ? date + ' ' + weekday : date + ' ' + time;\n      return {\n        ok: true,\n        result: { iso: d.toISOString(), timestamp: ts, date, time, weekday, timezoneOffset: d.getTimezoneOffset() },\n        display,\n      };\n    } catch (err) {\n      return toolError(errorMessage(err));\n    }\n  },\n};\n\nconst MEMORY_WRITE: ToolDefinition = {\n  name: 'memory_write',\n  description: '把一条事实写入长期记忆（跨会话共享），相同 key 会覆盖更新',\n  parameters: {\n    type: 'object',\n    properties: {\n      key: { type: 'string', description: '记忆名称，例如 项目代号' },\n      value: { type: 'string', description: '记忆内容，例如 Orion' },\n    },\n    required: ['key', 'value'],\n  },\n  run(args, ctx) {\n    try {\n      const key = cleanText(args?.key, 40);\n      const value = cleanText(args?.value, 240);\n      if (!key) return toolError('缺少记忆名称 key');\n      if (!value) return toolError('缺少记忆内容 value');\n      if (!ctx || typeof ctx.writeMemory !== 'function') return toolError('记忆服务不可用');\n      const item = ctx.writeMemory({ key, value, source: '记忆工具', sessionId: ctx.sessionId });\n      if (!item) return toolError('写入记忆失败');\n      return { ok: true, result: { id: item.id, key: item.key, value: item.value }, display: item.key + ' = ' + item.value };\n    } catch (err) {\n      return toolError(errorMessage(err));\n    }\n  },\n};\n\nconst MEMORY_SEARCH: ToolDefinition = {\n  name: 'memory_search',\n  description: '按关键词检索长期记忆，返回最相关的几条事实',\n  parameters: {\n    type: 'object',\n    properties: { query: { type: 'string', description: '关键词或问题，例如 项目代号' } },\n    required: ['query'],\n  },\n  run(args, ctx) {\n    try {\n      if (!ctx || typeof ctx.searchMemory !== 'function') return toolError('记忆服务不可用');\n      const query = cleanText(args?.query, 120);\n      const matches = ctx.searchMemory(query || '') || [];\n      const list = matches.map((item) =\u003e ({ id: item.id, key: item.key, value: item.value }));\n      return {\n        ok: true,\n        result: { query, count: list.length, matches: list },\n        display: list.length ? list.map((item) =\u003e item.key + ' = ' + item.value).join('；') : '没有找到相关记忆',\n      };\n    } catch (err) {\n      return toolError(errorMessage(err));\n    }\n  },\n};\n\n/* ── 工具注册表 ── */\nexport const LAB_TOOLS: ToolDefinition[] = [CALCULATOR, CLOCK, MEMORY_WRITE, MEMORY_SEARCH];\n\n/** 发给模型的工具 schema（去掉 run，model stage detail 用）。 */\nexport const LAB_TOOL_SCHEMAS = LAB_TOOLS.map((tool) =\u003e ({\n  name: tool.name,\n  description: tool.description,\n  parameters: tool.parameters,\n}));\n\n/** 供调试 / 详情展示的 schema JSON 串。 */\nexport const LAB_TOOL_SCHEMAS_JSON = json(LAB_TOOL_SCHEMAS);\n"])</script><script>self.__next_f.push([1,"8:T34bc,"])</script><script>self.__next_f.push([1,"// 规则驱动的模拟 LLM：意图识别 + 下一步决策 + 流式最终回答。\n// 教学用「假模型」，离线、可复现。它绝不伪造工具结果——算术 / 时间 / 记忆都走 20-tools 真实执行。\n\nimport {\n  LAB_BUDGET,\n  LAB_MAX_INPUT_CHARS,\n  LAB_PACE_DELAYS,\n  LAB_RECENT_KEEP,\n  cleanText,\n  normalizePace,\n  truncate,\n} from './core';\nimport type { MemoryItem, ModelDecision, Pace } from './types';\n\nexport interface LlmLastTool {\n  name: string;\n  ok: boolean;\n  args: Record\u003cstring, unknown\u003e;\n  result: unknown;\n  display: string;\n}\n\nexport interface LlmContext {\n  input: string;\n  step: number;\n  lastTool?: LlmLastTool | null;\n  hits: MemoryItem[];\n  usage?: { used: number; limit: number };\n  compression?: { before: number; after: number } | null;\n}\n\n/* ── 固定文案 ── */\nconst EMPTY_TEXT = '你好，我是教学用的迷你 Agent。可以试试「帮助」「算一下 (12+30)*3」或「记住 我的项目代号是 Orion」。';\nconst HELP_TEXT =\n  '我是教学用的迷你 Agent，能力有：算术（calculator）、时间（clock）、记住/回忆事实（memory_write / memory_search）、查看工具和原理。' +\n  '可以试试：「算一下 (12+30)*3」「现在几点」「记住 我的项目代号是 Orion」。';\nconst GREETING_TEXT =\n  '你好！我是 Agent Lab 里规则驱动的迷你模型，离线、可复现。输入「算一下 (12+30)*3」看看 agent 如何调用工具，或输入「帮助」查看能力清单。';\nconst TOOLS_TEXT =\n  '我挂着 4 个工具：calculator（四则/幂运算）、clock（时间日期）、memory_write（写长期记忆）、memory_search（检索记忆）。' +\n  '模型只决定调用哪个工具、传什么参数，结果由工具真实返回。';\nconst PRINCIPLE_TEXT =\n  '我是一个最小可解释的 agent 循环：接收输入 → 组装上下文 → 模型决定（直接回答或调用工具）→ ' +\n  '执行工具并把结果放回上下文 → 模型再决定，直到给出最终回答。我是规则驱动的模拟模型，不联网，但结构和真实 LLM Agent 一致。';\nconst FORGET_TEXT = '想清空记忆的话，请在右侧「记忆」面板点「清空」，或调用 clearMemory()。我不会在对话里直接删记忆，避免误操作。';\n\n/* ── 意图识别 ── */\nconst isHelpQ = (input: string) =\u003e /^\\/help\\b/i.test(input) || /帮助|你能做什么|能干什么|会做什么|怎么用|使用说明/.test(input);\nconst isGreetingQ = (input: string) =\u003e\n  /^(你好|您好|嗨|哈喽|哈啰|hello|hi|hey|早上好|中午好|下午好|晚上好|在吗)[\\s!！。.～~]*$/i.test(input);\nconst isToolsQ = (input: string) =\u003e\n  /^工具[\\s?？。！!]*$/.test(input) ||\n  /(有哪些|有什么|几个|哪些).{0,4}工具|工具.{0,6}(列表|有哪些|是什么|作用|介绍)|tools?\\b/i.test(input);\nconst isPrincipleQ = (input: string) =\u003e\n  /你是谁|你是什么|怎么工作|如何工作|工作原理|原理|agent.{0,6}(循环|怎么|如何)|介绍.{0,4}自己|自我介绍一下|怎么运行|如何运行/i.test(input);\nconst isForgetQ = (input: string) =\u003e /忘掉|忘记|清空记忆|清除记忆|删除记忆|删掉记忆/.test(input);\nconst isCompactQ = (input: string) =\u003e /压缩|compact|总结.{0,4}上下文|上下文.{0,6}(满|超|预算|压缩)/i.test(input);\n\nconst isTimeQ = (input: string) =\u003e {\n  const trimmed = input.replace(/[。！？?！\\s]+$/g, '');\n  if (/^(时间|日期|今天|现在|几点|几号)$/.test(trimmed)) return true;\n  return /现在.{0,4}(几点|时间|日期|时刻)|当前.{0,4}(时间|日期)|今天.{0,4}(几号|日期|星期|周几)|(几点|几号|星期几|周几)(了|啊|呀)?[？?]?$|\\bnow\\b|\\bclock\\b/i.test(input);\n};\nconst isRecallQ = (input: string) =\u003e\n  /我的.{1,24}?(是什么|是多少|呢|叫什么|叫啥|多少)|你还记得|还记不记得|记得.{0,8}吗|回忆|记忆(里|中|库|面板)|^记忆$|查.{0,6}记忆|找.{0,6}记忆/.test(input);\nconst isWriteQ = (input: string) =\u003e /记住|记一下|记一记|记下|记好|保存|存一下|存下|我的.{1,20}是/.test(input);\nconst wantsSave = (input: string) =\u003e /记住|记下|记一下|记一记|保存|存一下|存下/.test(input);\n\n/* 从「我的X是什么」里抽关键词；泛化问法返回空串（让 memory_search 返回最近记忆）。 */\nfunction recallQuery(input: string): string {\n  if (/^(你还记得什么|你还记得些什么|还记得什么|你记得什么|记得什么|记忆|回忆|回忆一下|你还记得吗|你记得吗)[？?。！!\\s]*$/.test(input)) {\n    return '';\n  }\n  const matched = /我的(.{1,24}?)(?:是什么|是多少|呢|叫什么|叫啥|多少)/.exec(input);\n  if (matched \u0026\u0026 matched[1].trim()) return matched[1].trim();\n  const stripped = input\n    .replace(/你还记得|还记不记得|记得|回忆|记忆|一下|帮我|请问|吗|呢|什么|查|找|的|是/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n  return stripped || input;\n}\n\n/* 从输入里抽算式；抽不到返回 null。 */\nfunction extractExpression(input: string): string | null {\n  const cleaned = input.replace(/[^0-9+\\-*/%^().\\s]/g, ' ').replace(/\\s+/g, '');\n  if (!cleaned) return null;\n  if (!/[0-9]/.test(cleaned)) return null;\n  if (!/[+\\-*/%^]/.test(cleaned)) return null;\n  let depth = 0;\n  for (const ch of cleaned) {\n    if (ch === '(') depth += 1;\n    else if (ch === ')') {\n      depth -= 1;\n      if (depth \u003c 0) return null;\n    }\n  }\n  if (depth !== 0) return null;\n  if (/[+\\-*/%^]$/.test(cleaned)) return null;\n  if (/^[*/%^]/.test(cleaned)) return null;\n  return cleaned;\n}\n\nfunction trimPunct(text: unknown): string {\n  return String(text == null ? '' : text)\n    .replace(/^[「『\"'“\\s]+|[」』\"'”\\s]+$/g, '')\n    .replace(/[。！!？?；;，,、\\s]+$/g, '')\n    .trim();\n}\n\n/* 解析「记住 …」→ { key, value }；失败返回 null。 */\nfunction extractMemory(input: string): { key: string; value: string } | null {\n  let text = input;\n  const stripped = text.replace(\n    /^(请|麻烦|帮我|帮忙)?\\s*(记住|记一下|记一记|记下|记好|保存一下|保存|存一下|存下)[：:，,、\\s]*/,\n    '',\n  );\n  if (stripped !== text) text = stripped.trim();\n  if (!text) return null;\n  let m = /^我的(.{1,20}?)是(.+)$/.exec(text);\n  if (m) return { key: trimPunct(m[1]), value: trimPunct(m[2]) };\n  m = /^我的(.{1,20}?)叫(.+)$/.exec(text);\n  if (m) return { key: trimPunct(m[1]), value: trimPunct(m[2]) };\n  m = /^(.{1,20}?)\\s*是\\s*(.+)$/.exec(text);\n  if (m) return { key: trimPunct(m[1]), value: trimPunct(m[2]) };\n  m = /^(.{1,30}?)\\s*(?:=|：|:)\\s*(.+)$/.exec(text);\n  if (m) return { key: trimPunct(m[1]), value: trimPunct(m[2]) };\n  return { key: '备忘', value: trimPunct(text) };\n}\n\nfunction compactText(ctx: LlmContext): string {\n  const usage = ctx.usage ?? { used: 0, limit: LAB_BUDGET };\n  const used = usage.used;\n  const limit = usage.limit;\n  if (ctx.compression \u0026\u0026 typeof ctx.compression.before === 'number' \u0026\u0026 typeof ctx.compression.after === 'number') {\n    return (\n      '最近一次压缩把上下文从 ' +\n      ctx.compression.before +\n      ' tok 降到 ' +\n      ctx.compression.after +\n      ' tok。超过预算 90% 会自动压缩：保留最近 ' +\n      LAB_RECENT_KEEP +\n      ' 条消息，其余折叠成摘要；也可以点「压缩」立即执行。'\n    );\n  }\n  return (\n    '当前上下文 ' +\n    used +\n    '/' +\n    limit +\n    ' tok，超过 90% 会自动压缩：保留最近 ' +\n    LAB_RECENT_KEEP +\n    ' 条消息，其余折叠成摘要。点「压缩」可立即执行，右侧检查器能看到前后对比。'\n  );\n}\n\nfunction fallbackText(ctx: LlmContext, input: string): string {\n  const hits = ctx.hits || [];\n  let head = '我是规则驱动的模拟模型，没完全理解「' + truncate(input, 18) + '」。';\n  if (hits.length \u003e 0) head += '我记得' + hits[0].key + ' = ' + hits[0].value + '。';\n  return head + '可以试试：「帮助」「算一下 (12+30)*3」「现在几点」「记住 我的项目代号是 Orion」。';\n}\n\n/* ── 下一步决策 ── */\nexport function nextStep(ctx: LlmContext): ModelDecision {\n  const input = cleanText(ctx?.input, LAB_MAX_INPUT_CHARS);\n\n  // 已经执行过工具 → 根据结果继续\n  if (ctx?.lastTool \u0026\u0026 ctx.lastTool.name) return continueAfterTool(ctx, input);\n\n  if (!input) return { type: 'final', text: EMPTY_TEXT };\n  if (isHelpQ(input)) return { type: 'final', text: HELP_TEXT };\n  if (isGreetingQ(input)) return { type: 'final', text: GREETING_TEXT };\n  if (isToolsQ(input)) return { type: 'final', text: TOOLS_TEXT };\n  if (isPrincipleQ(input)) return { type: 'final', text: PRINCIPLE_TEXT };\n  if (isForgetQ(input)) return { type: 'final', text: FORGET_TEXT };\n  if (isCompactQ(input)) return { type: 'final', text: compactText(ctx) };\n\n  if (isTimeQ(input)) return { type: 'tool_call', name: 'clock', args: { format: 'full' } };\n\n  const expression = extractExpression(input);\n  if (expression) return { type: 'tool_call', name: 'calculator', args: { expression 保存记忆失败了：' + (reason || '未知原因') + '。' };\n    const key = result.key !== undefined ? String(result.key) : String(args.key || '');\n    const value = result.value !== undefined ? String(result.value) : String(args.value || '');\n    return { type: 'final', text: '已经记住：' + key + ' = ' + value + '。之后你问「' + key + '是什么」，我会用 memory_search 检索出来。' };\n  }\n\n  if (tool.name === 'memory_search') {\n    if (!tool.ok) return { type: 'final', text: '检索记忆失败了：' + (reason || '未知原因') + '。' };\n    const matches = Array.isArray(result.matches) ? (result.matches as Array\u003c{ key: string; value: string }\u003e) : [];\n    if (!matches.length) return { type: 'final', text: '我这边没有找到相关记忆——你还没告诉过我，或者它已经被清空了。要不要现在「记住 …」一下？' };\n    const facts = matches.slice(0, 3).map((item) =\u003e item.key + ' = ' + item.value).join('；');\n    return { type: 'final', text: '我记得：' + facts + '。这些是从长期记忆里检索到的，跨会话共享。' };\n  }\n\n  return { type: 'final', text: '工具 ' + tool.name + ' 返回：' + (display || '（空结果）') + '。' };\n}\n\n/* ── 流式输出 ── */\nexport interface StreamOptions {\n  pace: Pace;\n  sleep: (ms: number) =\u003e Promise\u003cvoid\u003e;\n  cancelled: () =\u003e boolean;\n  onToken: (chunk: string, isLast: boolean) =\u003e void;\n}\n\nexport async function streamAnswer(text: string, opts: StreamOptions): Promise\u003cboolean\u003e {\n  const { sleep, cancelled, onToken, pace } = opts;\n  const base = LAB_PACE_DELAYS[normalizePace(pace)] ?? LAB_PACE_DELAYS.normal;\n  const chars = Array.from(String(text ?? ''));\n  if (!chars.length) return true;\n\n  const chunkSize = Math.max(1, Math.ceil(chars.length / 60));\n  const chunks: string[] = [];\n  for (let i = 0; i \u003c chars.length; i += chunkSize) chunks.push(chars.slice(i, i + chunkSize).join(''));\n  const interval = Math.max(1, Math.min(base, Math.floor(1500 / Math.max(1, chunks.length))));\n\n  for (let i = 0; i \u003c chunks.length; i += 1) {\n    if (cancelled()) return false;\n    await sleep(interval);\n    if (cancelled()) return false;\n  (s) lines.push(truncate(s, 60));\n    }\n    return lines.slice(-LAB_MAX_SUMMARY_LINES).join('\\n');\n  }\n\n  function firstSentence(text: string): string {\n    const end = text.search(/[。\\n]/);\n    return (end === -1 ? text : text.slice(0, end + 1)).replace(/\\s+/g, ' ').trim();\n  }\n\n  function compactSession(session: SessionData): { before: number; after: number; folded: number } | null {\n    const live = session.messages.slice(session.foldedCount);\n    if (live.length \u003c= recentKeep) return null;\n    const foldCount = live.length - recentKeep;\n    const toFold = session.messages.slice(0, session.foldedCount + foldCount);\n    const before = assembleContext(session, lastInput, inputMsgId).used;\n    const newSummary = summarizeMessages(toFold);\n    const maxSummary = Math.max(1, Math.floor(budget * LAB_SUMMARY_TOKEN_RATIO));\n    session.summary = session.summary\n      ? truncateToTokens(session.summary + '\\n' + newSummary, maxSummary)\n      : truncateToTokens(newSummary, maxSummary);\n    session.foldedCount += foldCount;\n    session.compressions += 1;\n    stats.compressions += 1;\n    const after = assembleContext(session, lastInput, inputMsgId).used;\n    const saved = before - after;\n    if (saved \u003e 0) stats.tokensSaved += saved;\n    return { before, after, folded: foldCount };\n  }\n\n  /* ── turn 循环 ── */\n\n  function addStage(turn: Turn, kind: Stage['kind'], title: string, meta: string, detail?: unknown): Stage {\n    const stage: Stage = { id: id('st'), kind, title, meta, status: 'active', detail: detail ?? null, at: now() };\n    turn.stages.push(stage);\n    emit({ type: 'stage' });\n    return stage;\n  }\n\n  async function runTool(name: string, args: Record\u003cstring, unknown\u003e, session: SessionData): Promise\u003cToolResult\u003e {\n    const tool = LAB_TOOLS.find((t) =\u003e t.name === name);\n    if (!tool) return { ok: false, result: { error: '未找到工具 ' + name }, display: '错误：未找到工具 ' + name };\n    const toolCtx: ToolContext = {\n      now,\n      sessionId: session.id,\n      writeMemory,\n      searchMemory,\n    };\n    try {\n      return await tool.run(args, toolCtx);\n    } catch (err) {\n      const msg = errorMessage(err);\n      return { ok: false, result: { error: msg }, display: '错误：' + msg };\n    }\n  }\n\n  async function streamOut(session: SessionData, text: string, stage: Stage): Promise\u003cvoid\u003e {\n    const line: TranscriptLine = { id: id('ln'), kind: 'agent', text: '', at: now(), streaming: true };\n    session.transcript.push(line);\n    if (session.transcript.length \u003e LAB_MAX_TRANSCRIPT) session.transcript = session.transcript.slice(-LAB_MAX_TRANSCRIPT);\n    emit({ type: 'line' });\n    streamingLine = { lineId: line.id, text: '' };\n\n    await streamAnswer(text, {\n      pace,\n      sleep,\n      cancelled: () =\u003e cancelled || disposed,\n      onToken: (chunk, isLast) =\u003e {\n        line.text += chunk;\n        line.streaming = !isLast;\n        streamingLine = { lineId: line.id, text: line.text };\n        emit({ type: 'token', text: chunk });\n      },\n    });\n\n    line.streaming = false;\n    streamingLine = null;\n    const msg = newMessage('assistant', text, 'final');\n    pushMessage(session, msg);\n    stage.status = 'done';\n    emit({ type: 'message' });\n    emit({ type: 'line' });\n    emit({ type: 'stage' });\n  }\n\n  async function submit(text: string): Promise\u003cvoid\u003e {\n    if (busy || disposed) return;\n    const input = cleanText(text, LAB_MAX_INPUT_CHARS);\n    if (!input) return;\n\n    busy = true;\n    cancelled = false;\n    lastInput = input;\n    const session = activeSession();\n    if (!session) {\n      busy = false;\n      return;\n    }\n\n    session.turns += 1;\n    stats.turns += 1;\n    const turnId = id('turn');\n    const turn: Turn = { id: turnId, input, status: 'running', startedAt: now(), endedAt: null, stages: [] };\n    currentTurn = turn;\n    emit({ type: 'turn_start', turnId });\n\n    try {\n      // 输入\n      const inputMsg = newMessage('user', input);\n      inputMsgId = inputMsg.id;\n      pushMessage(session, inputMsg);\n      pushLine(session, 'user', input);\n      addStage(turn, 'input', '输入', charCount(input) + ' 字 · ' + estimateTokens(input) + ' tok');\n      emit({ type: 'message' });\n      emit({ type: 'line' });\n\n      // 组装上下文（压缩前）\n      let ctx = assembleContext(session, input, inputMsgId);\n      contextView = ctx;\n      addStage(turn, 'context', '组装上下文', ctx.used + ' / ' + budget + ' tok', {\n        segments: ctx.segments,\n        hits: ctx.hits.map((h) =\u003e h.key + '=' + h.value),\n      });\n      emit({ type: 'context' });\n\n      // 压缩检查\n      if (ctx.used \u003e budget * LAB_COMPRESS_RATIO) {\n        const r = compactSession(session);\n        if (r) {\n          addStage(turn, 'compress', '压缩上下文', r.before + ' → ' + r.after + ' tok', r);\n          pushLine(session, 'compress', '⇣ 上下文已压缩 · ' + r.before + ' → ' + r.after + ' tok');\n          emit({ type: 'compression' });\n          emit({ type: 'line' });\n          ctx = assembleContext(session, input, inputMsgId);\n          contextView = ctx;\n          emit({ type: 'context' });\n        }\n      }\n\n      // 模型循环\n      let finalText = '';\n      let step = 0;\n      let lastTool: LlmLastTool | null = null;\n      let realMessages: OpenAiMessage[] | null = null;\n\n      while (step \u003c LAB_MAX_STEPS) {\n        step += 1;\n        if (cancelled || disposed) break;\n\n        let decision: ModelDecision;\n        let promptDetail: unknown;\n        if (realClient) {\n          realMessages = realMessages ?? buildRealMessages(session, input);\n          decision = await realClient.complete({ messages: realMessages, tools: LAB_TOOL_SCHEMAS });\n          promptDetail = realMessages;\n        } else {\n          decision = nextStep({ input, step, lastTool, hits: contextView.hits, usage: { used: contextView.used, limit: budget } });\n          promptDetail = assemblePromptText(session, input);\n        }\n        const modelStage = addStage(turn, 'model', '模型决策 · 第 ' + step + ' 步', '', {\n          step,\n          prompt: promptDetail,\n          response: decision,\n        });\n        modelStage.status = 'done';\n\n        if (decision.type === 'tool_call') {\n          const toolStage = addStage(turn, 'tool', '工具调用 · ' + decision.name, json(decision.args));\n          pushLine(session, 'tool', '⚙ ' + decision.name + ' ' + json(decision.args));\n          emit({ type: 'tool_call', name: decision.name });\n          emit({ type: 'line' });\n\n          const res = await runTool(decision.name, decision.args, session);\n          toolStage.meta = res.ok ? '返回 ' + res.display : res.display;\n          toolStage.status = res.ok ? 'done' : 'error';\n          toolStage.detail = { name: decision.name, args: decision.args, result: res.result, display: res.display, ok: res.ok };\n          emit({ type: 'stage' });\n\n          pushMessage(session, newMessage('tool', res.display, 'tool_result', decision.name));\n          pushLine(session, 'toolresult', '← ' + res.display);\n          emit({ type: 'tool_result', name: decision.name, ok: res.ok });\n          emit({ type: 'message' });\n          emit({ type: 'line' });\n\n          if (decision.name === 'memory_write' \u0026\u0026 res.ok) {\n            const r = res.result as { key?: string; value?: string };\n            pushLine(session, 'memory', '◈ 记忆已保存 · ' + (r.key || '') + ' = ' + (r.value || ''));\n            emit({ type: 'memory' });\n            emit({ type: 'line' });\n          }\n\n          stats.toolCalls += 1;\n          lastTool = { name: decision.name, ok: res.ok, args: decision.args, result: res.result, display: res.display };\n          if (realClient \u0026\u0026 realMessages) realMessages = appendToolExchange(realMessages, decision, res.display);\n\n          ctx = assembleContext(session, input, inputMsgId);\n          contextView = ctx;\n          emit({ type: 'context' });\n          continue;\n        }\n\n        finalText = decision.text;\n        break;\n      }\n\n      if (!finalText) throw new Error('超过 ' + LAB_MAX_STEPS + ' 步仍未收敛，可能是工具循环没终止');\n\n      // 输出\n      const outStage = addStage(turn, 'output', '输出', estimateTokens(finalText) + ' tok', { text: finalText });\n      await streamOut(session, finalText, outStage);\n      turn.status = 'done';\n      turn.endedAt = now();\n    } catch (err) {\n      turn.status = 'error';\n      turn.endedAt = now();\n      const msg = errorMessage(err);\n      addStage(turn, 'output', '错误', msg).status = 'error';\n      pushLine(session, 'error', '✗ ' + msg);\n      emit({ type: 'error', message: msg });\n      emit({ type: 'line' });\n    } finally {\n      busy = false;\n      currentTurn = null;\n      streamingLine = null;\n      persist();\n      emit({ type: 'turn_end', turnId });\n      emit({ type: 'stage' });\n    }\n  }\n\n  /* ── 会话 / 记忆操作 ── */\n\n  function newSessionInternal(): SessionData {\n    const s: SessionData = {\n      id: id('sess'),\n      title: '新会话',\n      createdAt: now(),\n      updatedAt: now(),\n      messageCount: 0,\n      tokens: 0,\n      compressions: 0,\n      turns: 0,\n      messages: [],\n      transcript: [],\n      summary: null,\n      foldedCount: 0,\n    };\n    s.transcript.push({ id: id('ln'), kind: 'banner', text: LAB_BANNER, at: now() });\n    sessions.unshift(s);\n    trimSessions();\n    activeId = s.id;\n    contextView = { limit: budget, used: 0, segments: [], hits: [], summary: null, messageCount: 0 };\n    persist();\n    emit({ type: 'state' });\n    return s;\n  }\n\n  function metaOf(s: SessionData): SessionMeta {\n    return {\n      id: s.id,\n      title: s.title,\n      createdAt: s.createdAt,\n      updatedAt: s.updatedAt,\n      messageCount: s.messageCount,\n      tokens: s.tokens,\n      compressions: s.compressions,\n      turns: s.turns,\n    };\n  }\n\n  function persist(): void {\n    if (disposed) return;\n    try {\n      storage.setItem(\n        LAB_STORAGE_KEY,\n        json({\n          sessions: sessions.map((s) =\u003e ({\n            ...s,\n            messages: s.messages.slice(-LAB_MAX_MESSAGES),\n            transcript: s.transcript.slice(-LAB_MAX_TRANSCRIPT),\n          })),\n          memory,\n          stats,\n        }),\n      );\n    } catch {\n      /* 存储失败不影响运行 */\n    }\n  }\n\n  function load(): void {\n    try {\n      const raw = storage.getItem(LAB_STORAGE_KEY);\n      if (!raw) return;\n      const data = JSON.parse(raw) as { sessions?: SessionData[]; memory?: MemoryItem[]; stats?: LabStats };\n      if (data \u0026\u0026 Array.isArray(data.sessions)) sessions = data.sessions;\n      if (data \u0026\u0026 Array.isArray(data.memory)) memory = data.memory;\n      if (data \u0026\u0026 data.stats) stats = data.stats;\n      if (sessions.length) activeId = sessions[0].id;\n    } catch {\n      /* 解析失败按全新状态启动 */\n    }\n  }\n\n  /* ── 对外 API ── */\n\n  function snapshot(): Snapshot {\n    const s = activeSession();\n    return clone({\n      busy,\n      pace,\n      activeId,\n      sessions: sessions.map(metaOf),\n      messages: s ? s.messages.slice(-LAB_MAX_MESSAGES) : [],\n      transcript: s ? s.transcript.slice(-LAB_MAX_TRANSCRIPT) : [],\n      memory: memory.slice(),\n      context: contextView,\n      turn: currentTurn ? clone(currentTurn) : null,\n      streaming: streamingLine ? { ...streamingLine } : null,\n      stats: { ...stats },\n      lastInput,\n      realModel: !!realClient,\n    });\n  }\n\n  function compact(): void {\n    if (busy || disposed) return;\n    const session = activeSession();\n    if (!session) return;\n    const live = session.messages.slice(session.foldedCount);\n    if (live.length \u003c= recentKeep) {\n      pushLine(session, 'info', '没有足够的历史可压缩（保留最近 ' + recentKeep + ' 条）');\n      emit({ type: 'line' });\n      persist();\n      return;\n    }\n    const r = compactSession(session);\n    if (r) {\n      pushLine(session, 'compress', '⇣ 上下文已压缩 · ' + r.before + ' → ' + r.after + ' tok');\n      contextView = assembleContext(session, lastInput, inputMsgId);\n      emit({ type: 'compression' });\n      emit({ type: 'line' });\n      emit({ type: 'context' });\n    }\n    persist();\n  }\n\n  function newSession(): boolean {\n    if (busy || disposed) return false;\n    newSessionInternal();\n    return true;\n  }\n\n  function switchSession(targetId: string): boolean {\n    if (busy || disposed) return false;\n    const target = sessions.find((s) =\u003e s.id === targetId);\n    if (!target) return false;\n    activeId = target.id;\n    emit({ type: 'state' });\n    return true;\n  }\n\n  function deleteSession(targetId: string): void {\n    if (busy || disposed) return;\n    sessions = sessions.filter((s) =\u003e s.id !== targetId);\n    if (sessions.length === 0) {\n      newSessionInternal();\n    } else if (activeId === targetId) {\n      activeId = sessions[0].id;\n    }\n    persist();\n    emit({ type: 'state' });\n  }\n\n  function clearMemory(): void {\n    memory = [];\n    persist();\n    emit({ type: 'memory' });\n  }\n\n  function deleteMemory(targetId: string): void {\n    memory = memory.filter((m) =\u003e m.id !== targetId);\n    persist();\n    emit({ type: 'memory' });\n  }\n\n  function resetAll(): void {\n    sessions = [];\n    memory = [];\n    stats = EMPTY_STATS();\n    activeId = '';\n    newSessionInternal();\n    persist();\n    emit({ type: 'state' });\n  }\n\n  function setPace(p: Pace): void {\n    pace = normalizePace(p);\n    emit({ type: 'state' });\n  }\n\n  function setRealClient(client: RealClient | null): void {\n    realClient = client;\n    emit({ type: 'state' });\n  }\n\n  function dispose(): void {\n    disposed = true;\n    cancelled = true;\n    listeners.clear();\n  }\n\n  function onEvent(fn: (e: LabEvent) =\u003e void): () =\u003e void {\n    listeners.add(fn);\n    return () =\u003e listeners.delete(fn);\n  }\n\n  // 启动：恢复或新建\n  load();\n  if (sessions.length === 0) {\n    newSessionInternal();\n  } else {\n    activeId = sessions[0].id;\n  }\n\n  return {\n    snapshot,\n    onEvent,\n    submit,\n    compact,\n    newSession,\n    switchSession,\n    deleteSession,\n    clearMemory,\n    deleteMemory,\n    resetAll,\n    setPace,\n    setRealClient,\n    dispose,\n  };\n}\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"GCk5wC0dXLYyoJn_URBp9\",\"p\":\"/ai-basics\",\"c\":[\"\",\"agent-lab\",\"\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"agent-lab\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/ai-basics/_next/static/css/ae2e8ec9dcd4f37c.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/ai-basics/_next/static/css/3e854cdc17d2cb53.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"zh-CN\",\"children\":[\"$\",\"body\",null,{\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[],[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":{\"fontFamily\":\"system-ui,\\\"Segoe UI\\\",Roboto,Helvetica,Arial,sans-serif,\\\"Apple Color Emoji\\\",\\\"Segoe UI Emoji\\\"\",\"height\":\"100vh\",\"textAlign\":\"center\",\"display\":\"flex\",\"flexDirection\":\"column\",\"alignItems\":\"center\",\"justifyContent\":\"center\"},\"children\":[\"$\",\"div\",null,{\"children\":[[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"body{color:#000;background:#
