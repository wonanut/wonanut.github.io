<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面走丢了 — Doran</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .err{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 24px}
  .err-code{font-family:var(--mono);font-size:clamp(72px,16vw,160px);font-weight:800;letter-spacing:-.06em;
    line-height:1;background:linear-gradient(120deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .err h1{font-size:clamp(22px,3vw,30px);margin-top:18px}
  .err p{color:var(--muted);margin-top:12px;max-width:420px}
  .err-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="err">
  <div>
    <div class="err-code">404</div>
    <h1>这个页面不存在</h1>
    <p>可能是链接过期，或者地址打错了。你可以回到首页，或者直接去读那门课。</p>
    <div class="err-actions">
      <a class="btn btn-primary" href="/">回到首页</a>
      <a class="btn btn-ghost" href="/course/">进入课程</a>
    </div>
  </div>
</main>
</body>
</html>
