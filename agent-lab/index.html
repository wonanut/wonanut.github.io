<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 实验室 · Doran</title>
<meta name="description" content="在浏览器里体验一个迷你 Agent 的完整循环：上下文组装、模型决策、工具调用、记忆写入与压缩；同时可翻阅正在运行的源码与 12 节原理长文。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="canonical" href="https://wonanut.github.io/agent-lab/">
<meta property="og:type" content="website">
<meta property="og:title" content="Agent 实验室 · Doran">
<meta property="og:description" content="一间开在浏览器里的 Agent 解剖教室。">
<meta property="og:url" content="https://wonanut.github.io/agent-lab/">
<style>
  :root{
    --bg:#07090e; --panel:#0b0e15; --line:rgba(255,255,255,.09);
    --text:#e9edf7; --muted:#9aa5b8; --dim:#6b7689;
    --accent:#8b93ff; --accent-2:#5eead4;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{scroll-behavior:smooth}
  body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
    background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  ::selection{background:rgba(139,147,255,.35)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

  .topbar{flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;height:58px;
    border-bottom:1px solid var(--line);background:rgba(7,9,14,.72);backdrop-filter:blur(14px);z-index:20}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;
    letter-spacing:-.01em;white-space:nowrap}
  .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07090e;
    font-family:var(--mono);font-size:13px;font-weight:800}
  .brand small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;font-weight:600;line-height:1.4}
  .crumbs{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumbs b{color:var(--text);font-weight:600}
  .crumbs .mit{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);
    border:1px solid var(--line);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px}
  .spacer{flex:1}
  .navlink{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:9px;
    border:1px solid transparent;white-space:nowrap;transition:.16s;background:none;cursor:pointer;
    font-family:inherit;line-height:1.5}
  .navlink:hover{color:var(--text);border-color:var(--line);background:rgba(255,255,255,.04)}
  .navlink.ghost{border-color:var(--line);background:rgba(255,255,255,.03)}

  .lab-wrap{flex:1;min-height:0;display:flex}
  .lab-frame{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--panel);
    /* DSH design tokens the plugin CSS expects — dark mapping for this site */
    --dsw-alias-bg-base:#07090e;
    --dsw-alias-bg-layer-1:#0b0e15;
    --dsw-alias-bg-layer-2:#10141d;
    --dsw-alias-bg-layer-3:#151a24;
    --dsw-alias-label-primary:#e9edf7;
    --dsw-alias-label-secondary:#b9c2d4;
    --dsw-alias-label-tertiary:#8d98ad;
    --dsw-alias-border-l1:rgba(255,255,255,.09);
    --dsw-alias-border-l2:rgba(255,255,255,.16);
    --dsw-alias-brand-primary:#8b93ff;
    --dsw-alias-state-error-primary:#fb7185;
    --dsw-alias-state-success-primary:#5eead4;
    --dsw-alias-state-warn-primary:#fbbf24;
  }
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-family:var(--mono);
    font-size:12px;letter-spacing:.08em}

  @media (max-width:760px){
    .topbar{padding:0 12px;gap:8px;height:54px}
    .brand span:not(.mark){display:none}
    .crumbs{font-size:12px}
    .crumbs .mit{display:none}
    .navlink{padding:6px 8px;font-size:12px}
    .navlink.hide-sm{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" title="返回 Doran 的个人首页">
      <span class="mark">D.</span>
      <span>Doran<small>Agent Lab</small></span>
    </a>
    <span class="crumbs">/ <b>Agent 实验室</b><span class="mit">MIT</span></span>
    <span class="spacer"></span>
    <button class="navlink ghost" id="fullscreen-btn" type="button" title="浏览器全屏">⛶ 全屏</button>
    <a class="navlink hide-sm" href="../course/">课程</a>
    <a class="navlink" href="https://github.com/wonanut/dsh-plugins/tree/main/agent-lab-plugin" target="_blank" rel="noopener">插件源码</a>
    <a class="navlink hide-sm" href="README.md" title="关于这个静态版">说明</a>
  </header>

  <main class="lab-wrap">
    <h1 class="sr-only">Agent 实验室 — 交互式迷你 Agent 演示</h1>
    <div class="lab-frame" id="lab-root" aria-label="Agent 实验室交互界面">
      <div class="loading" id="lab-loading">正在组装迷你 Agent…</div>
    </div>
  </main>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var root = document.getElementById('lab-root');
      var loading = document.getElementById('lab-loading');
      if (!window.AgentLab || typeof window.AgentLab.mount !== 'function') {
        if (loading) loading.textContent = '加载失败：找不到 AgentLab 运行时。';
        return;
      }
      try {
        window.AgentLab.mount(root);
      } catch (error) {
        if (loading) loading.textContent = '初始化失败：' + ((error && error.message) || error);
        return;
      }
      if (loading) loading.remove();

      /* browser fullscreen (the page itself already fills one screen) */
      var btn = document.getElementById('fullscreen-btn');
      var doc = document;
      var canFullscreen = !!(doc.fullscreenEnabled || doc.webkitFullscreenEnabled);
      function fullscreenEl() { return doc.fullscreenElement || doc.webkitFullscreenElement; }
      function request() {
        var el = doc.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) { var p = fn.call(el); if (p && p.catch) p.catch(function () {}); }
      }
      function exit() {
        var fn = doc.exitFullscreen || doc.webkitExitFullscreen;
        if (fn) { var p = fn.call(doc); if (p && p.catch) p.catch(function () {}); }
      }
      function sync() {
        if (!btn) return;
        btn.textContent = fullscreenEl() ? '⤡ 退出全屏' : '⛶ 全屏';
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 120);
      }
      if (btn) {
        if (!canFullscreen) { btn.style.display = 'none'; }
        else {
          btn.addEventListener('click', function () { if (fullscreenEl()) exit(); else request(); });
          doc.addEventListener('fullscreenchange', sync);
          doc.addEventListener('webkitfullscreenchange', sync);
        }
      }
    })();
  </script>
</body>
</html>
